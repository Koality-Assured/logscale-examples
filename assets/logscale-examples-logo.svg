<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#F59E0B" />
    <circle cx="256" cy="71" r="5" fill="#F59E0B" />
    <circle cx="441" cy="256" r="14" stroke="#DC2626" />
    <circle cx="441" cy="256" r="5" fill="#DC2626" />
    <circle cx="256" cy="441" r="14" stroke="#00F0FF" />
    <circle cx="256" cy="441" r="5" fill="#00F0FF" />
    <circle cx="71" cy="256" r="14" stroke="#F59E0B" />
    <circle cx="71" cy="256" r="5" fill="#F59E0B" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Streaming Log Telemetry & Signal Wave Motif -->
    <rect x="150" y="160" width="212" height="170" rx="14" fill="#0B0F19" stroke="#F59E0B" stroke-width="4" />
    <!-- Stream Pulse Wave -->
    <path d="M 165 245 L 205 245 L 220 185 L 238 295 L 256 220 L 272 265 L 288 205 L 304 245 L 345 245" 
          fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Parsing Marker Indices -->
    <circle cx="220" cy="185" r="5" fill="#F59E0B" />
    <circle cx="238" cy="295" r="5" fill="#DC2626" />
    <circle cx="288" cy="205" r="5" fill="#F59E0B" />
    <!-- Data Ingestion Status Bars -->
    <rect x="175" y="178" width="18" height="6" rx="2" fill="#DC2626" />
    <rect x="200" y="178" width="28" height="6" rx="2" fill="#F59E0B" />
    <rect x="235" y="178" width="12" height="6" rx="2" fill="#00F0FF" />
    <!-- Stream Vector Flow Lines -->
    <line x1="165" y1="305" x2="345" y2="305" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 6" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#DC2626" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#F59E0B" filter="url(#glow)" />
</svg>
