<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#F59E0B" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#F59E0B" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#DC2626" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#DC2626" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#F59E0B" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#DC2626" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#F59E0B" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- Streaming Log Telemetry & Signal Wave Motif -->
    <rect x="150" y="160" width="212" height="170" rx="14" fill="#0B0F19" stroke="#F59E0B" stroke-width="4" />
    <!-- Stream Pulse Wave -->
    <path d="M 165 245 L 205 245 L 220 185 L 238 295 L 256 220 L 272 265 L 288 205 L 304 245 L 345 245" 
          fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Parsing Marker Indices -->
    <circle cx="220" cy="185" r="5" fill="#F59E0B" />
    <circle cx="238" cy="295" r="5" fill="#DC2626" />
    <circle cx="288" cy="205" r="5" fill="#F59E0B" />
    <!-- Data Ingestion Status Bars -->
    <rect x="175" y="178" width="18" height="6" rx="2" fill="#DC2626" />
    <rect x="200" y="178" width="28" height="6" rx="2" fill="#F59E0B" />
    <rect x="235" y="178" width="12" height="6" rx="2" fill="#00F0FF" />
    <!-- Stream Vector Flow Lines -->
    <line x1="165" y1="305" x2="345" y2="305" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 6" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#F59E0B" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • LOGSCALE BLUEPRINTS</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">LOGSCALE EXAMPLES &amp; ARCHITECTURE</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Enterprise Streaming Parsers, CQL Reference Blueprints &amp; AWS Log Ingestion Pipelines</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: CrowdStrike CQL -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="183" height="38" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#F59E0B" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CrowdStrike CQL</text>
      </g>
      <!-- Chip 2: Falcon LogScale -->
      <g transform="translate(197, 0)">
        <rect x="0" y="0" width="183" height="38" rx="8" fill="#111827" stroke="#DC2626" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#DC2626" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Falcon LogScale</text>
      </g>
      <!-- Chip 3: Streaming Parsers -->
      <g transform="translate(394, 0)">
        <rect x="0" y="0" width="201" height="38" rx="8" fill="#111827" stroke="#00F0FF" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#00F0FF" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Streaming Parsers</text>
      </g>
      <!-- Chip 4: AWS Ingestion -->
      <g transform="translate(609, 0)">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AWS Ingestion</text>
      </g>
    </g>
  </g>
</svg>
